name: Sync programs from Google Calendar

# DISABLED: Google Sheet is now the source of truth for programs.
# The programs.json file remains as a static fallback only.
# Run manually via workflow_dispatch if you need to refresh programs.json.
on:
  workflow_dispatch:
  # schedule:           # <-- disabled; Sheet API feeds the site directly
  #   - cron: '0 * * * *'

# Prevent calendar sync from racing with Pages deployment.
# cancel-in-progress: false = queue behind running deploy, never cancel it.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync-programs:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build programs JSON from Google Calendar
        run: |
          python scripts/sync_google_calendar.py \
            --calendar-id "innerevolutionyoga.life@gmail.com" \
            --calendar-title "InneREvolution Programs" \
            --calendar-public-url "https://calendar.google.com/calendar/u/0?cid=innerevolutionyoga.life%40gmail.com" \
            --timezone "Europe/Vienna" \
            --output "data/programs.json"

      - name: Check for changes
        id: check
        run: |
          if git diff --quiet -- data/programs.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No changes detected — skipping deploy."
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Changes detected — will commit and deploy."
          fi

      - name: Commit updated programs feed
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/programs.json
          git commit -m "chore: sync upcoming programs from Google Calendar"
          git push
