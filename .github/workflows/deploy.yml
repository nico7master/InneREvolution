name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only one deploy at a time; queue rather than cancel.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # !! Secrets are injected here — config.js is NEVER committed to git
      - name: Generate booking/config.js from secrets
        env:
          SHEET_ID:         ${{ secrets.PROGRAMS_SHEET_ID }}
          SHEETS_API_KEY:   ${{ secrets.SHEETS_API_KEY }}
          DEFAULT_FORM_URL: ${{ secrets.DEFAULT_FORM_URL }}
        run: |
          printf 'const CONFIG = {\n  SHEET_ID:        "%s",\n  SHEETS_API_KEY:  "%s",\n  // APPS_SCRIPT_URL disabled — booking now uses external form links\n  DEFAULT_FORM_URL: "%s"\n};\n' \
            "$SHEET_ID" "$SHEETS_API_KEY" "$DEFAULT_FORM_URL" > booking/config.js
          echo "--- config.js generated ---"
          cat booking/config.js

      - name: Compile main SCSS
        run: npm run build:css

      - name: Compile booking SCSS
        run: npm run build:booking

      - name: Prepare deploy (remove .gitignore so all generated files are included)
        run: |
          rm -f .gitignore
          echo "--- Verify config.js exists ---"
          ls -la booking/config.js
          head -3 booking/config.js

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
